<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .content {
            max-width: 700px;
        }

        .content h1 {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: white;
            color: #4f46e5;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #f3f4f6;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="content">
            <h1>Welcome to Our Website</h1>
            <p>
                Build amazing websites with modern design and responsive layouts.
                This landing page covers the full screen height.
            </p>
            <a href="#" class="btn">Get Started</a>
        </div>
    </section>

</body>
</html>
