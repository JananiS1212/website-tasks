<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f1f5f9;
}


/* Header */

.header{
    background:#0f172a;
    color:white;
    padding:20px 10%;
}

.header h1{
    font-size:28px;
}


/* Container */

.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
}


/* Settings Box */

.settings-box{
    background:white;
    padding:30px;
    border-radius:15px;
    margin-bottom:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}


.settings-box h2{
    margin-bottom:20px;
    color:#1e293b;
    border-bottom:2px solid #e2e8f0;
    padding-bottom:10px;
}


/* Form */

.form-group{
    margin-bottom:20px;
}


.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#475569;
}


.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
}


/* Toggle */

.option{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #e2e8f0;
}


.switch{
    width:45px;
    height:24px;
    background:#2563eb;
    border-radius:20px;
    position:relative;
}


.switch::after{
    content:"";
    width:20px;
    height:20px;
    background:white;
    position:absolute;
    right:3px;
    top:2px;
    border-radius:50%;
}


/* Button */

.btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}


.btn:hover{
    background:#1d4ed8;
}



/* Responsive */

@media(max-width:600px){

.container{
    width:95%;
}

}

</style>

</head>


<body>


<!-- Header -->

<div class="header">

<h1>Settings</h1>

</div>



<div class="container">


<!-- Profile Settings -->


<div class="settings-box">

<h2>Profile Settings</h2>


<div class="form-group">

<label>Full Name</label>

<input type="text" value="John Smith">

</div>


<div class="form-group">

<label>Email Address</label>

<input type="email" value="john@gmail.com">

</div>


<div class="form-group">

<label>Phone Number</label>

<input type="text" value="+91 9876543210">

</div>


<button class="btn">
Save Changes
</button>


</div>





<!-- Password Settings -->


<div class="settings-box">

<h2>Change Password</h2>


<div class="form-group">

<label>Current Password</label>

<input type="password">

</div>


<div class="form-group">

<label>New Password</label>

<input type="password">

</div>


<div class="form-group">

<label>Confirm Password</label>

<input type="password">

</div>


<button class="btn">
Update Password
</button>


</div>





<!-- Notification Settings -->


<div class="settings-box">

<h2>Notification Settings</h2>


<div class="option">

<p>Email Notifications</p>

<div class="switch"></div>

</div>


<div class="option">

<p>SMS Notifications</p>

<div class="switch"></div>

</div>


<div class="option">

<p>Push Notifications</p>

<div class="switch"></div>

</div>


</div>






<!-- Privacy Settings -->


<div class="settings-box">

<h2>Privacy Settings</h2>


<div class="form-group">

<label>Account Visibility</label>

<select>

<option>Public</option>

<option>Private</option>

</select>

</div>


<div class="form-group">

<label>Language</label>

<select>

<option>English</option>

<option>Hindi</option>

<option>Marathi</option>

</select>

</div>


<button class="btn">
Save Settings
</button>


</div>


</div>


</body>
</html>
