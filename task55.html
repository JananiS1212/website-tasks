<!DOCTYPE html>
<html>

<body>


<h2>Report Generator</h2>


<button onclick="generateReport()">
Generate Report
</button>


<pre id="report"></pre>


<script>


function generateReport(){


let data={

date:new Date(),

totalUsers:500,

activeUsers:120,

sales:25000

};


document.getElementById("report")
.innerHTML=

JSON.stringify(data,null,2);


}


</script>


</body>

</html>
