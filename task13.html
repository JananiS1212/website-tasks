<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Mode Feature</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    background:#f8fafc;
    color:#1e293b;
    min-height:100vh;
    transition:0.4s;

}


/* Dark Mode */

body.dark{

    background:#020617;
    color:white;

}


.container{

    width:90%;
    max-width:900px;
    margin:50px auto;

}


/* Header */

.header{

    background:#2563eb;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-radius:12px;

}


.toggle-btn{

    background:white;
    color:#2563eb;
    border:none;
    padding:12px 20px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;

}


/* Cards */

.cards{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;

}


.card{

    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.4s;

}


/* Dark Card */

.dark .card{

    background:#1e293b;
    color:white;

}


.card h2{

    color:#2563eb;
    margin-bottom:10px;

}


.dark .card h2{

    color:#38bdf8;

}


.footer{

    margin-top:40px;
    text-align:center;
    padding:20px;

}


/* Mobile */

@media(max-width:600px){

.header{

    flex-direction:column;
    gap:15px;

}

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>My Dashboard</h1>

<button class="toggle-btn" onclick="toggleDarkMode()">
🌙 Dark Mode
</button>


</div>




<div class="cards">


<div class="card">

<h2>Profile</h2>

<p>
Name: John Smith
</p>

<p>
Role: Administrator
</p>

</div>



<div class="card">

<h2>Statistics</h2>

<p>
Users: 2500
</p>

<p>
Projects: 120
</p>

</div>



<div class="card">

<h2>Settings</h2>

<p>
Manage your account preferences.
</p>

</div>


</div>



<div class="footer">

<p>
© 2026 My Dashboard
</p>

</div>


</div>




<script>


function toggleDarkMode(){

    document.body.classList.toggle("dark");


    if(document.body.classList.contains("dark")){

        localStorage.setItem("theme","dark");

    }
    else{

        localStorage.setItem("theme","light");

    }

}



// Load saved theme

window.onload=function(){

    let theme=localStorage.getItem("theme");


    if(theme==="dark"){

        document.body.classList.add("dark");

    }

}


</script>



</body>
</html>
